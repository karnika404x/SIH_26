<body class="bg-background text-on-surface h-screen w-screen flex items-center justify-center overflow-hidden antialiased">
<main class="w-full max-w-[480px] px-margin-mobile md:px-0">
<div class="bg-surface-container border border-outline-variant rounded-xl p-8 relative shadow-[0_4px_6px_-1px_rgba(0,0,0,0.5)] flex flex-col">
<div class="absolute top-6 right-6 flex items-center gap-2 bg-background border border-outline-variant px-3 py-1.5 rounded-full">
<span class="w-2 h-2 rounded-full bg-status-success shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span>
<span class="font-mono-label text-mono-label text-on-surface-variant">Zero-Egress Verified</span>
</div>
<div class="flex flex-col items-center mt-4 mb-8">
<div class="w-16 h-16 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-tertiary text-3xl" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2 tracking-tight text-center">Sovereign AI Workbench</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center uppercase tracking-widest text-[10px]">Authorized Personnel Only</p>
</div>
<div class="w-full h-px bg-outline-variant mb-8"></div>

<!-- Error message box (hidden by default) -->
<div class="hidden mb-4 p-3 bg-error-container border border-error rounded flex items-center gap-2" id="error-box">
<span class="material-symbols-outlined text-error text-lg">error</span>
<p class="font-body-sm text-body-sm text-on-error-container" id="error-text">Invalid PSU ID or password</p>
</div>

<form class="flex flex-col gap-5" id="loginForm">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="employee-id">PSU Employee ID</label>
<div class="relative flex items-center bg-background border border-outline-variant rounded group glow-focus transition-all duration-200 focus-within:border-tertiary">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant group-focus-within:text-tertiary transition-colors">badge</span>
<input class="w-full bg-transparent border-none text-on-surface font-mono-label text-mono-label pl-10 pr-4 py-3 focus:ring-0 placeholder:text-outline" id="employee-id" placeholder="Enter ID" required="" type="text">
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative flex items-center bg-background border border-outline-variant rounded group glow-focus transition-all duration-200 focus-within:border-tertiary">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant group-focus-within:text-tertiary transition-colors">lock</span>
<input class="w-full bg-transparent border-none text-on-surface font-mono-label text-mono-label pl-10 pr-4 py-3 focus:ring-0 placeholder:text-outline tracking-[0.2em]" id="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<button class="mt-6 bg-tertiary hover:brightness-110 text-on-tertiary font-label-md text-label-md py-3.5 rounded transition-all duration-200 flex items-center justify-center gap-2 group w-full" id="submitBtn" type="submit">
<span id="btnText" class="">Secure Login</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" id="btnIcon">login</span>
<svg class="hidden animate-spin h-5 w-5 text-on-tertiary" fill="none" id="loadingIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</button>
</form>
<div class="mt-8 flex gap-3 p-4 bg-background border border-outline-variant rounded">
<span class="material-symbols-outlined text-status-warning text-xl shrink-0 mt-0.5">warning</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed text-xs">
                    This system is monitored and restricted to authorized organizational personnel. All access attempts are logged.
                </p>
</div>
</div>
</main>

<script>
  // ===== Sovereign AI Workbench - Login Logic =====
  const BACKEND_URL = "http://127.0.0.1:8000";

  const form = document.getElementById('loginForm');
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const btnIcon = document.getElementById('btnIcon');
  const loadingIcon = document.getElementById('loadingIcon');
  const errorBox = document.getElementById('error-box');
  const errorText = document.getElementById('error-text');

  function showError(message) {
    errorText.textContent = message;
    errorBox.classList.remove('hidden');
  }

  function hideError() {
    errorBox.classList.add('hidden');
  }

  function setLoading(isLoading) {
    const inputs = document.querySelectorAll('input');
    if (isLoading) {
      btnText.textContent = 'Verifying credentials...';
      btnIcon.classList.add('hidden');
      loadingIcon.classList.remove('hidden');
      btn.classList.add('opacity-80', 'cursor-not-allowed');
      inputs.forEach(input => input.disabled = true);
    } else {
      btnText.textContent = 'Secure Login';
      btnIcon.classList.remove('hidden');
      loadingIcon.classList.add('hidden');
      btn.classList.remove('opacity-80', 'cursor-not-allowed');
      inputs.forEach(input => input.disabled = false);
    }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    hideError();

    const psuId = document.getElementById('employee-id').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!psuId || !password) {
      showError('Please enter both PSU ID and Password');
      return;
    }

    setLoading(true);

    try {
      const res = await fetch(`${BACKEND_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ psu_id: psuId, password: password })
      });
      const data = await res.json();

      if (data.success) {
        // Save the id so other screens can show "Logged in as ..."
        sessionStorage.setItem('psu_id', psuId);
        window.location.href = 'dashboard.html';
      } else {
        setLoading(false);
        showError(data.message || 'Invalid PSU ID or password');
      }
    } catch (err) {
      setLoading(false);
      showError('Could not reach server. Make sure the backend is running on port 8000.');
      console.error(err);
    }
  });
</script>
</body></html>
